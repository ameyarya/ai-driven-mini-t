<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rook · Rover</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#10151d;color:#edf2fa}*{box-sizing:border-box}body{max-width:1300px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 14px}.muted,summary,label{color:#a7b3c5;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#080b10;pointer-events:none}.panel{padding:20px;background:#19212d;border:1px solid #2c3748;border-radius:12px}button{font:inherit;color:inherit;background:#29364a;border:1px solid #40516b;border-radius:8px;padding:11px 15px;cursor:pointer;touch-action:none;user-select:none}button:hover{background:#344662}button:active{background:#42648e}button:disabled{opacity:.5;cursor:wait}.primary{background:#277b58;border-color:#46a477}.actions{display:flex;gap:8px}.actions button{flex:1}#auto-status{line-height:1.5;color:#91dfb7;min-height:44px;font-size:14px}.g{display:grid;grid-template-columns:repeat(3,48px);gap:6px;justify-content:center;margin:16px 0}.g button{padding:8px;height:44px;font-size:22px}.manual{border-top:1px solid #354154;margin-top:20px;padding-top:18px}.hint{font-size:12px;line-height:1.6;color:#9caec5}#status{font-size:13px;color:#a7b3c5}details{border-top:1px solid #354154;padding-top:14px;margin-top:16px}summary{cursor:pointer}input{width:100%;padding:10px;color:inherit;background:#101722;border:1px solid #40516b;border-radius:8px;font:inherit;margin:8px 0}label{display:block;margin-top:14px}#analyze{width:100%;font-size:14px}#vision-status{font-size:13px;color:#b6c9e6;line-height:1.5;margin-top:10px}#snapshot{width:100%;border-radius:8px;margin:14px 0}#result{font-size:13px;line-height:1.5}.result-label{font-size:11px;color:#8295af;text-transform:uppercase;margin-top:12px}#answer,#action{color:#91dfb7}.aux{display:flex;gap:6px;margin-top:12px}.aux button{font-size:12px;padding:9px}.camera-note{font-size:12px;color:#8295af;margin-top:8px}@media(max-width:800px){body{padding:14px}main{grid-template-columns:1fr}.panel{padding:16px}}

/* Fit the control surface to the browser viewport. */
html{height:100%;overflow:hidden}
body{height:100dvh;max-width:1200px;padding:16px;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;margin-bottom:12px}
main{flex:1;min-height:0;position:relative;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
main>section{min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.video{display:block;max-height:calc(100dvh - 105px);flex:0 1 auto;min-height:0}
.panel{min-height:0;padding:14px;position:relative}
h2{font-size:15px;margin-bottom:10px}button{padding:9px 12px;font-size:14px}
#auto-status{font-size:13px;min-height:36px;margin:10px 0}
.hint{font-size:11px;line-height:1.45}.manual{margin-top:12px;padding-top:12px}
.g{grid-template-columns:repeat(3,42px);gap:4px;margin:10px 0}.g button{height:36px;padding:5px;font-size:20px}
details{padding-top:10px;margin-top:10px}summary{font-size:12px}
.panel details[open]{position:absolute;z-index:2;inset:0;background:#19212d;border:1px solid #40516b;border-radius:12px;margin:0;padding:16px;overflow:auto}
.panel details[open]>summary{position:sticky;top:0;background:#19212d;padding:6px 0 12px;color:#edf2fa}
.panel details[open]>summary::after{content:' · click to close';color:#8295af;font-size:11px}
#snapshot{max-height:180px;object-fit:contain}
@media(max-height:620px){body{padding:10px}header{margin-bottom:8px}h1{font-size:20px}.panel{padding:10px}.manual{margin-top:8px;padding-top:8px}.hint{font-size:10px}.g{margin:6px 0}.g button{height:30px}details{padding-top:7px;margin-top:7px}#auto-status{margin:6px 0;min-height:30px}.video{max-height:calc(100dvh - 85px)}}
@media(max-width:800px){body{padding:10px}main{grid-template-columns:minmax(0,1fr) 230px;gap:10px}.panel{padding:10px}}
@media(max-width:540px){main{grid-template-columns:minmax(0,1fr) 190px;gap:8px}.panel{padding:8px}.muted{font-size:10px}h2{font-size:13px}.actions button{padding:8px}.hint{font-size:10px}.g{grid-template-columns:repeat(3,36px)}}

/* Align the camera frame with the full control column. */
main>section{justify-content:flex-start;align-items:stretch;position:relative}
.video{height:100%;max-height:none;aspect-ratio:auto;flex:1 1 0;min-height:0}
.camera-note{position:absolute;left:12px;bottom:10px;margin:0;padding:5px 8px;border-radius:6px;background:#10151dcc;pointer-events:none}

.manual[hidden]{display:none}

#decision{line-height:1.5;margin:10px 0;max-height:6em;overflow:auto;color:#c4d2e4}

header{flex-wrap:wrap;gap:10px}
.camera-tools{flex-basis:100%;display:flex;align-items:center;gap:10px;min-width:0}
.camera-tools input{flex:1;min-width:0;margin:0;font-size:13px;padding:9px}
.camera-tools #analyze{width:auto;flex:0 0 auto;padding:9px 16px}
.camera-tools details{margin:0;padding:0;border:0;flex:0 0 auto}
.camera-tools summary{padding:9px 12px;border:1px solid #40516b;border-radius:8px}
.camera-tools #vision-status{font-size:11px;margin:0;max-width:210px}
.camera-tools details[open]{position:fixed;z-index:10;right:24px;top:120px;width:min(440px,calc(100vw - 48px));max-height:calc(100dvh - 145px);overflow:auto;background:#19212d;padding:16px;border:1px solid #40516b;border-radius:12px;box-shadow:0 15px 50px #0008}
.camera-tools details[open]>summary{position:sticky;top:0;background:#19212d}
.camera-tools details[open]>summary::after{content:' · close';color:#8295af}
@media(max-width:800px){.camera-tools #vision-status{display:none}}

.camera-tools[hidden],#result{display:none}
</style></head><body>
<header><h1>Rook</h1><span class="muted">Local Qwen · Tank POC</span><div class="camera-tools" hidden><span id="vision-status" hidden></span></div></header>
<main><section><iframe class="video" src="http://localhost:8889/live/tank/?autoplay=true&muted=true&controls=false" title="DJI live camera" tabindex="-1"></iframe><div class="camera-note"><span id="camera-status" role="status">Camera · checking…</span> · about 1 second delay</div></section>
<aside class="panel"><label for="nav-goal">Navigation goal</label><input id="nav-goal" maxlength="1000" placeholder="Enter a goal" autocomplete="off"><div class="actions"><button id="auto-start" class="primary" disabled>Start</button><button id="auto-stop">Stop</button></div><p id="auto-status" role="status" aria-live="polite">Ready</p><p id="decision" class="hint" role="status">No decision yet.</p><div class="hint">Short moves, then stop and look again.<br>Escape or manual input takes over.</div>
<div class="manual" hidden><h2>Manual control</h2><div class="g"><span></span><button data-key="W" aria-label="Forward">↑</button><span></span><button data-key="A" aria-label="Left">←</button><span></span><button data-key="D" aria-label="Right">→</button><span></span><button data-key="S" aria-label="Backward">↓</button><span></span></div><div class="hint">Hold arrow keys to drive. Release to stop.</div><div id="status" role="status">Stopped</div></div>


</aside><div hidden id="result"><img id="snapshot" alt=""><span id="answer"></span><span id="action"></span><span id="scene"></span><span id="reason"></span><span id="obstacles"></span><span id="uncertainties"></span><span id="timing"></span></div></main><script>


let wanted='X', fire=0, aim=0, busy=false, last='X|0|0';
const held=new Set();
const keyMap={ArrowUp:'W',ArrowLeft:'A',ArrowDown:'S',ArrowRight:'D','1':'Q','2':'E',' ':'F',Escape:'X'};
function state(){return wanted+'|'+fire+'|'+aim}
async function pump(){
 if(busy || (state()==='X|0|0' && last===state()))return;
 busy=true;
 const sent=state(), k=wanted, f=fire, a=aim;
 try{
  const r=await fetch('/control?c='+k+'&fire='+f+'&aim='+a+'&speed='+100,{cache:'no-store',signal:AbortSignal.timeout(700)});
  if(!r.ok)throw Error('Command failed');
  last=sent;
  document.querySelector('#status').textContent=[k==='X'?'':('Driving '+k),f?'Firing':'',a?'Moving launcher':''].filter(Boolean).join(' · ')||'Stopped';
 }catch(e){wanted='X';fire=0;aim=0;held.clear();document.querySelector('#status').textContent='Connection lost';}
 finally{busy=false;if(state()!==sent)pump();}
}
function update(){
 const keys=[...held];
 wanted=keys.filter(k=>'WASD'.includes(k)).at(-1)||'X';
 fire=held.has('F')?1:0;
 const q=keys.filter(k=>k==='Q'||k==='E').at(-1);
 aim=q==='Q'?-1:q==='E'?1:0;
 pump();
}
function stop(){held.clear();update();stopAuto()}
setInterval(pump,100);
addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();stop();return;}
  if(e.target.matches('input,textarea'))return;
  const k=keyMap[e.key];
  if(!k)return;
  e.preventDefault();
  if(e.repeat)return;
  if(k==='X'){stop();return;}
  held.delete(k);held.add(k);update();
});
addEventListener('keyup',e=>{
 const k=keyMap[e.key];
 if(held.delete(k))update();
});
addEventListener('blur',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
document.querySelectorAll('button[data-key]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(b.dataset.key);update()});
 const release=()=>{held.delete(b.dataset.key);update()};
 b.addEventListener('pointerup',release);
 b.addEventListener('pointercancel',release);
 b.addEventListener('lostpointercapture',release);
});

let autoActive=false,cameraLive=false;

let displayedFrame='',latestCapture=0;
async function pollVision(){
 if(autoActive)return;
 try{
  const response=await fetch('/vision/status',{cache:'no-store',signal:AbortSignal.timeout(3000)});
  if(!response.ok)throw Error('Vision server unavailable');
  const state=await response.json();

  const label=document.querySelector('#vision-status');
  if(state.state==='running'){label.textContent='Capturing frame / Qwen analyzing… '+Math.max(0,Math.floor(Date.now()/1000-state.started_at))+'s';return;}
  if(state.state==='error'){label.textContent='Analysis failed: '+state.error;return;}
  if(state.state!=='done')return;
  const r=state.result,a=r.assessment;
  if(r.captured_at<latestCapture)return;
  latestCapture=r.captured_at;
  document.querySelector('#decision').textContent=String(a.answer||a.reason||'No answer');
  label.textContent='Analysis complete · '+r.inference_seconds+'s inference';
  if(displayedFrame!==r.frame){
   displayedFrame=r.frame;
   document.querySelector('#snapshot').src='/vision/frame?t='+r.captured_at;
   document.querySelector('#result').hidden=false;
   document.querySelector('#action').textContent=String(a.suggested_action).toUpperCase();
   for(const name of ['answer','scene','reason','obstacles','uncertainties']){
    const value=a[name];document.querySelector('#'+name).textContent=Array.isArray(value)?value.join(' · ')||'None reported':String(value||'None reported');
   }
  }
  document.querySelector('#timing').textContent='Snapshot '+Math.max(0,Math.floor(Date.now()/1000-r.captured_at))+'s ago · no automatic movement';
 }catch(error){document.querySelector('#vision-status').textContent=error.message;}
}
function stopAuto(){
 autoActive=false;
 fetch('/autonomy/stop',{method:'POST',keepalive:true}).catch(()=>{});
}
function showAutoResult(r){
 if(r.captured_at<latestCapture)return;
 latestCapture=r.captured_at;
 const a=r.assessment;
 document.querySelector('#decision').textContent=String(a.suggested_action).toUpperCase()+' — '+String(a.reason||a.answer||'');
 document.querySelector('#result').hidden=false;
 if(displayedFrame!==r.frame){
  displayedFrame=r.frame;
  document.querySelector('#snapshot').src='/vision/frame?source=autonomy&t='+r.captured_at;
 }
 document.querySelector('#action').textContent=String(a.suggested_action).toUpperCase();
 for(const name of ['answer','scene','reason','obstacles','uncertainties']){
  const value=a[name];document.querySelector('#'+name).textContent=Array.isArray(value)?value.join(' · ')||'None reported':String(value||'None reported');
 }
 document.querySelector('#timing').textContent='Snapshot '+Math.max(0,Math.floor(Date.now()/1000-r.captured_at))+'s ago';
}
async function pollAuto(){
 try{
  const response=await fetch('/autonomy/status',{cache:'no-store',signal:AbortSignal.timeout(3000)});
  if(!response.ok)throw Error('Autonomy server unavailable');
  const state=await response.json();
  autoActive=['observing','moving','settling'].includes(state.state);
  document.querySelector('#auto-start').disabled=autoActive||!cameraLive;

  const progress={idle:'Ready',observing:state.step>1?'Analyzing again':'Analyzing',moving:'Moving',settling:'Stopped · waiting for fresh video',complete:'Goal achieved',stopped:'Stopped',error:'Run failed'};
  let line=progress[state.state]||state.state;
  if(state.state==='moving')line+=' '+(state.last_action||'');
  if(state.state==='observing'&&state.last_action)line+=' · last move '+state.last_action;
  if(['stopped','error'].includes(state.state))line+=' — '+(state.message||'');
  document.querySelector('#auto-status').textContent=line+(state.step?' · step '+state.step+'/40':'');
  if(autoActive)document.querySelector('#vision-status').textContent='Autonomous goal running · '+state.state;
  if(state.result)showAutoResult(state.result);
  if(autoActive)await fetch('/autonomy/heartbeat',{method:'POST',signal:AbortSignal.timeout(3000)});
 }catch(error){stopAuto();document.querySelector('#auto-status').textContent=error.message;}
}
document.querySelector('#auto-start').addEventListener('click',async()=>{
 if(!cameraLive){document.querySelector('#auto-status').textContent='Camera offline — restart Mimo';return;}
 held.clear();wanted='X';fire=0;aim=0;
 while(busy)await new Promise(resolve=>setTimeout(resolve,30));
 last=state();
 try{
  const response=await fetch('/autonomy/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:document.querySelector('#nav-goal').value}),signal:AbortSignal.timeout(5000)});
  if(!response.ok)throw Error(await response.text());
  autoActive=true;await pollAuto();
 }catch(error){document.querySelector('#auto-status').textContent=error.message;}
});
document.querySelector('#auto-stop').addEventListener('click',stop);
addEventListener('pagehide',stopAuto);
async function pollCamera(){
 try{
  const response=await fetch('/camera/status',{cache:'no-store',signal:AbortSignal.timeout(2000)});
  if(!response.ok)throw Error('Camera status unavailable');
  cameraLive=(await response.json()).live===true;
 }catch{cameraLive=false;}
 const badge=document.querySelector('#camera-status');
 badge.textContent=cameraLive?'● Camera live':'● Camera offline';
 badge.style.color=cameraLive?'#91dfb7':'#f3ad87';
 document.querySelector('#auto-start').disabled=autoActive||!cameraLive;
 if(!cameraLive&&autoActive)stopAuto();
}
let polling=false;
async function refreshStatus(){
 if(polling)return;polling=true;
 try{await pollCamera();await pollAuto();if(!autoActive)await pollVision();}
 finally{polling=false;}
}
setInterval(refreshStatus,1000);refreshStatus();
</script></body></html>
